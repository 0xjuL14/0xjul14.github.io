<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testando o GitHub Pages!</title>
  <style>
    body { background:#000; color:#e4e2e2; font-family:'JetBrains Mono',monospace;
           max-width:760px; margin:60px auto; padding:0 20px; }
    h1 { color:#7fff00; }
    h2 { color:#a855f7; }
    .card { border:1px solid #e4e2e2; border-radius:6px; padding:20px; margin:20px 0; }
    button { background:#a855f7; color:#000; border:none; border-radius:4px;
             padding:10px 16px; font-family:inherit; font-weight:700; cursor:pointer; }
    button:hover { background:#7fff00; }
    #msg { color:#7fff00; margin-top:12px; min-height:1.5em; }
  </style>
</head>
<body>
  <h1>$ echo "Oie, GitHub Pages!"</h1>

  <div class="card">
    <h2>Testando o Github Pages</h2>
    <p>Estou aprendendo a usar meu conhecimento em HTML, CSS e JavaScript no GitHub Pages!</p>
  </div>

  <div class="card">
    <h2>JavaScript funcionando?</h2>
    <button id="btn">Clique aqui</button>
    <p id="msg"></p>
  </div>

  <script>
    let cliques = 0;
    document.getElementById("btn").addEventListener("click", () => {
      cliques++;
      document.getElementById("msg").textContent =
        "Funcionou! Cliques: " + cliques;
    });
  </script>
</body>
</html>
